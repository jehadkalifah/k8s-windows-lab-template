[master]
k3s-master ansible_host=192.168.56.10 ansible_user=vagrant

[workers]
k3s-worker1 ansible_host=192.168.56.11 ansible_user=vagrant
k3s-worker2 ansible_host=192.168.56.12 ansible_user=vagrant

[k3s:children]
master
workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=/vagrant/.vagrant/machines/k3s-master/virtualbox/private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
