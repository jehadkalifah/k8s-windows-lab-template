configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      default: true
      config:
        region: minio
        s3ForcePathStyle: "true"
        s3Url: http://minio.velero.svc.cluster.local:9000
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: true
  uploaderType: kopia
  defaultBackupStorageLocation: default
  defaultBackupTTL: 168h

credentials:
  useSecret: true

deployNodeAgent: true

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.2
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

nodeAgent:
  uploaderType: kopia
