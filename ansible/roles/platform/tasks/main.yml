---
- name: Install Helm
  shell: |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | bash
  args:
    creates: /usr/local/bin/helm

- name: Install Gateway API CRDs
  shell: |
    kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Add Longhorn repo
  shell: helm repo add longhorn https://charts.longhorn.io
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Update Helm repositories
  shell: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install Longhorn
  shell: |
    helm upgrade --install longhorn longhorn/longhorn \
      --namespace longhorn-system \
      --create-namespace \
      --version {{ longhorn_version }} \
      --set persistence.defaultClass=true \
      --set defaultSettings.defaultReplicaCount=2 \
      --set defaultSettings.defaultDataPath=/var/lib/longhorn \
      --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Add MetalLB repo
  shell: helm repo add metallb https://metallb.github.io/metallb
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install MetalLB
  shell: |
    helm upgrade --install metallb metallb/metallb \
      --namespace metallb-system \
      --create-namespace \
      --version {{ metallb_version }} \
      --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Apply MetalLB address pool
  template:
    src: metallb-config.yaml.j2
    dest: /tmp/metallb-config.yaml
    mode: "0644"

- name: Configure MetalLB
  shell: kubectl apply -f /tmp/metallb-config.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Add Istio Helm repository
  shell: helm repo add istio https://istio.io/downloadIstio --force-update || true
    helm repo remove istio || true
    helm repo add istio https://blob.istio.io/istio-release/charts
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Update Istio repository
  shell: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install Istio base
  shell: |
    helm upgrade --install istio-base istio/base \
      --namespace istio-system \
      --create-namespace \
      --version {{ istio_version }} \
      --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install Istiod
  shell: |
    helm upgrade --install istiod istio/istiod \
      --namespace istio-system \
      --version {{ istio_version }} \
      --set profile=minimal \
      --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Create MinIO namespace
  shell: kubectl create namespace {{ minio_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Apply MinIO
  template:
    src: minio.yaml.j2
    dest: /tmp/minio.yaml
    mode: "0600"

- name: Deploy MinIO
  shell: kubectl apply -f /tmp/minio.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for MinIO
  shell: |
    kubectl -n {{ minio_namespace }} rollout status deployment/minio --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Add Velero repository
  shell: helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Update Velero repository
  shell: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Create Velero credentials
  copy:
    dest: /tmp/velero-credentials
    mode: "0600"
    content: |
      [default]
      aws_access_key_id={{ minio_access_key }}
      aws_secret_access_key={{ minio_secret_key }}

- name: Install Velero
  shell: |
    helm upgrade --install velero vmware-tanzu/velero \
      --namespace {{ velero_namespace }} \
      --create-namespace \
      --version {{ velero_chart_version }} \
      --set deployNodeAgent=true \
      --set credentials.useSecret=true \
      --set-file credentials.secretContents.cloud=/tmp/velero-credentials \
      -f /vagrant/ansible/templates/velero-values.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Create Velero backup location secret/config
  shell: |
    kubectl apply -f /vagrant/manifests/velero-bsl.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
