---
- name: Validate Stage 1 K3s base cluster
  hosts: local
  connection: local
  gather_facts: false
  become: true

  tasks:
    - name: Wait for all nodes to be Ready
      shell: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false

    - name: Verify three nodes
      shell: test "$(kubectl get nodes --no-headers | wc -l)" -eq 3
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: false
