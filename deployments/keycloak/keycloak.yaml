apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1

  db:
    vendor: postgres
    host: keycloak-postgres
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password

  http:
    httpEnabled: true
    httpPort: 8080
    serviceHttpPort: 8080
    serviceName: keycloak

  ingress:
    enabled: false

  hostname:
    hostname: http://__GATEWAY_IP__/keycloak
    strict: true

  proxy:
    headers: xforwarded

  additionalOptions:
    - name: http-relative-path
      value: /keycloak
    - name: metrics-enabled
      value: "true"
    - name: health-enabled
      value: "true"

  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: monitoring

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1536Mi
