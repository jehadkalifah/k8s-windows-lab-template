grafana:
  enabled: true
  adminPassword: "admin-lab"
  persistence:
    enabled: false
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: "4GB"
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        memory: 1536Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi

# K3s embeds these control-plane components; disable scrape targets that
# commonly remain unavailable in a local K3s lab.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
