global:
  enabled: true
  tlsDisable: true

injector:
  enabled: true

server:
  image:
    repository: hashicorp/vault
    tag: "2.0.4"
    pullPolicy: IfNotPresent

  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
    mountPath: /vault/data

  auditStorage:
    enabled: false

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true
        cluster_name = "k3s-lab-vault"

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

ui:
  enabled: true
  serviceType: ClusterIP

  # Keep the UI Service routable even while Vault pods are sealed or
  # uninitialized.
  publishNotReadyAddresses: true

  # Before initialization there is no vault-active=true HA leader yet.
  # Route to Vault server pods instead of requiring an active leader.
  activeVaultPodOnly: false

  externalPort: 8200
  targetPort: 8200
