apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
spec:
  auth:
    # Trusted local lab only. Anonymous access must not be exposed publicly.
    strategy: anonymous

  deployment:
    namespace: istio-system
    cluster_wide_access: true
    instance_name: kiali

  server:
    # Kiali officially supports a non-root web root.
    web_root: /kiali

  external_services:
    prometheus:
      enabled: true
      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090

    grafana:
      enabled: true
      internal_url: http://monitoring-grafana.monitoring.svc
      external_url: http://__GATEWAY_IP__/grafana
