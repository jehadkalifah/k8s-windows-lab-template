apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: velero
type: Opaque
stringData:
  MINIO_ROOT_USER: minio
  MINIO_ROOT_PASSWORD: minio123
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: velero
type: Opaque
stringData:
  cloud: |
    [default]
    aws_access_key_id = minio
    aws_secret_access_key = minio123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: velero
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: velero
  labels:
    component: minio
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      component: minio

  template:
    metadata:
      labels:
        component: minio

    spec:

      # ------------------------------------------------------------
      # Fix Longhorn volume permissions before MinIO starts.
      #
      # The alpine/minio image runs MinIO as the "minio" user.
      # Longhorn may mount the volume owned by root, which prevents
      # MinIO from creating /storage/.minio.sys.
      # ------------------------------------------------------------
      initContainers:
        - name: minio-storage-permissions

          image: docker.io/jehaddocker82/minio:RELEASE.2025-10-15T17-29-55Z
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c

          args:
            - |
              echo "Checking MinIO storage..."
              ls -ld /storage || true

              echo "Fixing MinIO storage ownership..."
              chown -R minio:minio /storage

              echo "Fixing MinIO storage permissions..."
              chmod -R u+rwX /storage

              echo "Storage after permission fix:"
              ls -ld /storage

              echo "MinIO storage permissions are ready."

          securityContext:
            runAsUser: 0
            runAsGroup: 0

          volumeMounts:
            - name: storage
              mountPath: /storage

      containers:
        - name: minio

          image: docker.io/jehaddocker82/minio:RELEASE.2025-10-15T17-29-55Z
          imagePullPolicy: IfNotPresent

          args:
            - server
            - /storage
            - --console-address=:9001

          envFrom:
            - secretRef:
                name: minio-credentials

          ports:
            - name: api
              containerPort: 9000
              protocol: TCP

            - name: console
              containerPort: 9001
              protocol: TCP

          volumeMounts:
            - name: storage
              mountPath: /storage

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: velero
spec:
  type: ClusterIP

  selector:
    component: minio

  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP

    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP