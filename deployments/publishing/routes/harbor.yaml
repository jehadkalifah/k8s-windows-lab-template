apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-ui
  namespace: harbor
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-ingress
      sectionName: http
  hostnames:
    - "__HARBOR_HOST__"
  rules:
    - backendRefs:
        - name: harbor
          port: 80
