apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring-ui
  namespace: monitoring
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: monitoring-grafana
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /prometheus
      backendRefs:
        - name: monitoring-kube-prometheus-prometheus
          port: 9090

    - matches:
        - path:
            type: PathPrefix
            value: /alertmanager
      backendRefs:
        - name: monitoring-kube-prometheus-alertmanager
          port: 9093
