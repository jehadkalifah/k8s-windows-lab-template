apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-entry
  namespace: longhorn-system
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /longhorn
        - path:
            type: Exact
            value: /longhorn/
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: http
            hostname: __LONGHORN_HOST__
            statusCode: 302
            path:
              type: ReplaceFullPath
              replaceFullPath: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-ingress
      sectionName: http
  hostnames:
    - __LONGHORN_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: longhorn-frontend
          port: 80
