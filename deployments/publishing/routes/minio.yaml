apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: velero
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-ingress
      sectionName: http
  rules:
    # Force a trailing slash so relative Console assets resolve below /minio/.
    - matches:
        - path:
            type: Exact
            value: /minio
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path:
              type: ReplaceFullPath
              replaceFullPath: /minio/

    # MinIO Console listens at its backend root. Preserve /minio/ externally,
    # but strip it before sending requests to port 9001.
    - matches:
        - path:
            type: PathPrefix
            value: /minio/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: minio
          port: 9001
