apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-entry
  namespace: vault
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /vault
        - path:
            type: Exact
            value: /vault/
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: http
            hostname: __VAULT_HOST__
            statusCode: 302
            path:
              type: ReplaceFullPath
              replaceFullPath: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-ui
  namespace: vault
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-ingress
      sectionName: http
  hostnames:
    - __VAULT_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vault-ui
          port: 8200
