apiVersion: v1
kind: Service
metadata:
  name: jenkins-external-svc
  namespace: jenkins
  annotations:
    lab.openai.local/component: jenkins
    lab.openai.local/backend-type: external-vm
    lab.openai.local/gateway-ref: public-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      appProtocol: http
      port: 8080
      targetPort: 8080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jenkins-external
  namespace: jenkins
  labels:
    kubernetes.io/service-name: jenkins-external-svc
  annotations:
    lab.openai.local/component: jenkins
    lab.openai.local/backend-type: external-vm
    lab.openai.local/gateway-ref: public-gateway
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    appProtocol: http
    port: 8080
endpoints:
  - addresses:
      - __JENKINS_LAN_IP__
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jenkins-http-route
  namespace: jenkins
  annotations:
    lab.openai.local/component: jenkins
    lab.openai.local/backend-type: external-vm
    lab.openai.local/gateway-ref: public-gateway
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-ingress
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /jenkins
      backendRefs:
        - name: jenkins-external-svc
          port: 8080
