apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-reloader-config
  namespace: demo
data:
  MESSAGE: "version-1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-reloader
  namespace: demo
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-reloader
  template:
    metadata:
      labels:
        app: demo-reloader
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do echo "$MESSAGE"; sleep 3600; done
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: demo-reloader-config
                  key: MESSAGE
