reloader:
  # Cluster-wide watcher, but workloads must explicitly opt in with an
  # annotation. Do not restart every workload by default.
  watchGlobally: true
  autoReloadAll: false

  # Preferred for this Argo CD / GitOps-oriented lab. Reloader updates the
  # pod-template annotation instead of injecting a dummy environment variable.
  reloadStrategy: annotations

  # Avoid recreating Jobs/CronJobs automatically when their referenced
  # ConfigMaps or Secrets change.
  ignoreJobs: true
  ignoreCronJobs: true

  # A newly created/deleted ConfigMap or Secret should not restart workloads
  # unless there is an actual update event to a watched resource.
  reloadOnCreate: false
  reloadOnDelete: false

  logLevel: info

  deployment:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
