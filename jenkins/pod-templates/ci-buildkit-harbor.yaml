apiVersion: v1
kind: Pod
metadata:
  labels:
    workload: jenkins-ci-harbor
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    fsGroup: 1000
  containers:
    - name: git
      image: alpine/git:latest
      command: ["sh", "-c"]
      args: ["sleep 99d"]
      tty: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 500m, memory: 256Mi }

    - name: dotnet
      image: mcr.microsoft.com/dotnet/sdk:10.0
      command: ["sh", "-c"]
      args: ["sleep 99d"]
      tty: true
      env:
        - { name: HOME, value: /home/jenkins/agent }
        - { name: DOTNET_CLI_HOME, value: /home/jenkins/agent/.dotnet }
        - { name: NUGET_PACKAGES, value: /home/jenkins/agent/.nuget/packages }
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits: { cpu: "2", memory: 2Gi }

    - name: buildkit
      image: moby/buildkit:v0.30.0-rootless
      command: ["sh", "-c"]
      args: ["sleep 99d"]
      tty: true
      env:
        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox --config /home/user/.config/buildkit/buildkitd.toml
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        seccompProfile: { type: Unconfined }
        appArmorProfile: { type: Unconfined }
      volumeMounts:
        - name: buildkit-state
          mountPath: /home/user/.local/share/buildkit
        - name: buildkit-harbor-config
          mountPath: /home/user/.config/buildkit
          readOnly: true
      resources:
        requests: { cpu: 500m, memory: 512Mi }
        limits: { cpu: "2", memory: 2Gi }

    - name: trivy
      image: aquasec/trivy:0.74.0
      command: ["sh", "-c"]
      args: ["sleep 99d"]
      tty: true
      env:
        - { name: HOME, value: /home/jenkins/agent }
        - { name: TRIVY_CACHE_DIR, value: /home/jenkins/agent/.trivycache }
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: "1", memory: 1Gi }
  volumes:
    - name: buildkit-state
      emptyDir:
        sizeLimit: 6Gi
    - name: buildkit-harbor-config
      configMap:
        name: buildkit-harbor-config
