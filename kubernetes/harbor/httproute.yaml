apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-ingress
      sectionName: http
  hostnames:
    - harbor.192-168-100-240.nip.io
  rules:
    - backendRefs:
        - name: harbor
          port: 80
